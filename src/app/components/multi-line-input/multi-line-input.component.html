<div class="line" *ngFor="let value of lines; let i = index; trackBy: trackByFn">
  <span class="button" (click)="removeLine(i)">-</span>
  <input type="text" #input [(ngModel)]="lines[i]" (ngModelChange)="handleChange()" (keydown.enter)="addLine(i + 1)" (keydown.backspace)="checkEmpty(i, $event)">
</div>
<div style="display: flex; width: 100%; justify-content: center">
  <span class="button" (click)="addLine()">+</span>
</div>
